[tool.poetry]
name = "pytest-kind-ng"
version = "22.11.1"
description = "Kubernetes test support with KIND for pytest"
authors = ["Henning Jacobs <henning@jacobs1.de>"]
license = "GPL-3.0+"
readme = "README.md"
repository = "https://github.com/kr8s-org/pytest-kind-ng"
packages = [{ include = "pytest_kind_ng" }]
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10"
]

[tool.poetry.plugins.pytest11]
pytest-kind-ng = "pytest_kind_ng.plugin"

[tool.poetry.dependencies]
python = ">=3.7"
pykube-ng = ">=0.30"

[tool.poetry.dev-dependencies]
pytest = ">=5.1"
pytest-cov = ">=2.7"
pre-commit = ">=2.9.3"
[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
