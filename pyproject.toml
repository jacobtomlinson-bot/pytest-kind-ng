[project]
name = "pytest-kind-ng"
version = "22.11.1"
description = "Kubernetes test support with KIND for pytest"
authors = [
    { name = "Henning Jacobs", email = "henning@jacobs1.de" },
    { name = "Jacob Tomlinson", email = "jacob@tomlinson.email" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Framework :: Pytest",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pykube-ng>=0.30",
]

[project.urls]
Repository = "https://github.com/kr8s-org/pytest-kind-ng"

[project.entry-points.pytest11]
pytest-kind-ng = "pytest_kind.plugin"

[tool.uv.build-backend]
module-name = "pytest_kind"
module-root = ""

[tool.taskipy.tasks]
lint = "pre-commit run --all-files"
test = "coverage run --source=pytest_kind -m pytest tests/ && coverage report"
test-local = "python -m http.server --directory fake-download 8000 & KIND_DOWNLOAD_URL=http://localhost:8000/kind coverage run --source=pytest_kind -m pytest -v tests/ && coverage report"

[dependency-groups]
dev = [
    "pre-commit>=2.9.3",
    "pytest-cov>=2.7",
    "pytest>=5.1",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"
