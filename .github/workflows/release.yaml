name: Publish to PyPI

"on":
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'kr8s-org/pytest-kind-ng'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-kind-ng
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build package
        run: uv build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
