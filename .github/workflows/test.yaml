name: Test

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install Poetry
        run: python -m pip install poetry==1.2.2

      - name: Run linters
        run: make lint

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.7"
            runner: ubuntu-22.04
          - python-version: "3.8"
            runner: ubuntu-latest
          - python-version: "3.9"
            runner: ubuntu-latest
          - python-version: "3.10"
            runner: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install poetry==1.2.2

      - name: Run tests
        run: |
          poetry install
          poetry run coverage run --source=pytest_kind_ng -m pytest tests/
          poetry run coverage report

      - name: Show Docker resources
        if: failure()
        run: docker ps --all
